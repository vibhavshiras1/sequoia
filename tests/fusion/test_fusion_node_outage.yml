############### force fusion log store sync ################
- section_start: sync_log_store

- template: sync_log_store
  wait: true

# give the forced sync a couple of minutes to complete before the outage
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "120"
  wait: true

- section_end: sync_log_store

############### node outage -- no topology change ################
# autofailover left OFF and the target node is restarted well before any
# failover timeout could matter -- membership never changes here. See
# tests/fusion/CHAOS_PLAN.md for why this is a deliberately separate,
# simpler test from an autofailover/rebalance cycle.
- section_start: node_outage

- template: disable_autofailover
  requires: "{{eq true .DoOnce }}"
  wait: true

# target a non-orchestrator active node -- all REST checks in this test hit
# {{.Orchestrator}}, which must stay reachable throughout the outage
- image: sequoiatools/cbutil
  command: "/cbinit.py {{.ActiveDataNode 1}} {{.SSHUsername}} {{.SSHPassword}} stop"
  wait: true

# exercise Fusion's forced-sync path WHILE the node is down, rather than just
# sitting idle for the whole outage window -- this is a REST call against
# {{.Orchestrator}} (still up), so it doesn't need the down node to respond;
# the interesting question is whether Fusion accounts for that node's
# now-unreachable vbuckets sanely instead of hanging or erroring out
- template: sync_log_store
  wait: true

- image: sequoiatools/cmd
  entrypoint: sleep
  command: "90"
  wait: true

- image: sequoiatools/cbutil
  command: "/cbinit.py {{.ActiveDataNode 1}} {{.SSHUsername}} {{.SSHPassword}} start"
  wait: true

# wait for the node's REST port to come back -- same tool Sequoia's own
# WaitForServers() uses during initial cluster setup
- image: martin/wait
  command: "-c {{.ActiveDataNode 1}}:{{.RestPort}} -t 300"
  wait: true

# let memcached warm up and DCP/replication re-establish before checking
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "180"
  wait: true

# fusion_rebalance-in: $1 (current, 4 active nodes) and $2 (new, those 4 plus
# one of the 2 spares held out by scope_fusion_node_outage.yml) genuinely
# differ this time, so run_fusion_rebalance.py's add_nodes() has something
# to add and the whole accelerated pipeline (prepareRebalance -> manifest
# split/sync -> accelerator -> start rebalance) actually moves data, rather
# than a no-op settle pass against an unchanged node set.
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.ActiveDataNode 0}},{{.ActiveDataNode 1}},{{.ActiveDataNode 2}},{{.ActiveDataNode 3}}), ({{.ActiveDataNode 0}},{{.ActiveDataNode 1}},{{.ActiveDataNode 2}},{{.ActiveDataNode 3}},{{.InActiveNode}}), 60, 1"
  wait: true

# fusion_rebalance's own script returns as soon as its POST /controller/rebalance
# call succeeds -- it does NOT block until the rebalance itself finishes. The
# actual data movement (and guest-volume drain) happens after this returns, so
# wait for the cluster-level rebalance to genuinely complete before checking
# anything about guest volumes.
- template: wait_for_rebalance
  wait: true

# buffer before polling for drain -- gives extent migration a moment to
# actually get underway if it hasn't already, so the drain-check below
# doesn't catch a false "empty" before migration starts. Doesn't fully
# replace TAF's seen_volumes gate (see the template's own comment in
# tests/templates/fusion.yml), just reduces the same risk.
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true

- template: wait_for_guest_volumes_drained
  wait: true

- section_end: node_outage

############### verify: no topology change, fusion still healthy ################
- section_start: verify_fusion

- template: get_fusion_status
  wait: true

# should be empty now -- wait_for_guest_volumes_drained above already
# confirmed this; fetched again here just to have it in this section's logs
- template: get_active_guest_volumes
  wait: true

# confirm cluster membership is unchanged -- still 4 active nodes, all healthy
- image: appropriate/curl
  command: "-s -u {{.RestUsername}}:{{.RestPassword}} {{.Orchestrator}}:{{.RestPort}}/pools/default"
  wait: true

- section_end: verify_fusion
