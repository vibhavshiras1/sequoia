############### load data into all 100 collections ################
# pillowfight, not magmaloader: with multiple --collection flags, cbc-pillowfight
# round-robins documents across all of them, so -I is the TOTAL across the 10
# collections in each bucket, not a per-collection count -- 500,000 total per
# bucket here, ~50,000/collection (5M documents total across all 10 buckets).
# scope_0 / coll_0..coll_9 -- CONFIRMED 0-based against a live cluster
# (Couchbase UI showed bucket1 with scope_0/coll_0-coll_9). The 1-based
# guess this comment originally made, based on other tests' comments
# describing this same tool as "scope_1,scope_2...", was wrong -- those
# apparently describe a different code path or version. Don't trust
# comments-as-precedent for this again; verify against a real cluster.
- section_start: data_load

- image: sequoiatools/pillowfight:7.0
  command: "-u {{.RestUsername}} -P {{.RestPassword}} -U couchbase://{{.Orchestrator}}/bucket1
            -I {{.Scale 500000}} -M 1024 -B 100 -t 4 --random-body
            --collection scope_0.coll_0 --collection scope_0.coll_1 --collection scope_0.coll_2
            --collection scope_0.coll_3 --collection scope_0.coll_4 --collection scope_0.coll_5
            --collection scope_0.coll_6 --collection scope_0.coll_7 --collection scope_0.coll_8
            --collection scope_0.coll_9 --json --populate-only"
