- include: tests/templates/fusion.yml, tests/templates/nfs.yml, tests/templates/kv.yml, tests/templates/rebalance.yml, tests/templates/collections.yml

############### set up NFS server + client mounts ################
- section_start: setup_nfs

- template: setup_nfs_server
  requires: "{{eq true .DoOnce }}"
  wait: true

# mounts the share on every node declared in the scope, including both
# spare nodes -- they may be pulled into a fusion_rebalance later
- template: setup_nfs_client_all_nodes
  requires: "{{eq true $.DoOnce }}"
  wait: true

- section_end: setup_nfs

############### configure and enable fusion ################
- section_start: setup_fusion

- template: configure_fusion
  args: "local:///mnt/nfs/share/buckets"
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: enable_fusion
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: wait_for_fusion_status
  args: "enabled"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: setup_fusion

############### create 10 fusion-backed buckets ################
# mix of 128/1024 vbuckets, 2 replicas, magma storage. Couchbase requires
# >= 1GB ram quota for any bucket with 1024 vbuckets, so the 5 buckets using
# 1024 vbuckets here all get >= 1024MB; the 5 using 128 vbuckets can go as
# low as 100MB. Sum across all 10: 10072MB, under the node's 10500MB quota.
# Created here, after enable_fusion, not in the scope file -- see the note
# at the top of scope_fusion_node_outage.yml for why.
- section_start: create_buckets

- image: sequoiatools/couchbase-cli:8.5
  command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket bucket1 --bucket-ramsize 100 --bucket-type couchbase
            --bucket-replica 2 --bucket-eviction-policy fullEviction
            --storage-backend magma --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
