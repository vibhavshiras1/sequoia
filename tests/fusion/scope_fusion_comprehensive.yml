---
# NOTE: no `buckets:` block, same reasoning as scope_fusion_simple.yml and
# scope_fusion_node_outage.yml -- Fusion must be enabled before a
# Fusion-backed bucket is created, and scope.SetupServer()'s automatic
# bucket creation runs before any test action does. All buckets here are
# created explicitly in test_fusion_comprehensive.yml, after enable_fusion.
#
# 6 nodes total, init_nodes: 4 -- service assignment (lib/spec.go,
# InitNodeServices()) only operates over the first `init_nodes` nodes, so
# nodes 4 and 5 (outside that range) are never assigned any service and stay
# plain, untouched spares -- reserved for the fusion_rebalance topology
# changes in test_fusion_comprehensive.yml (rebalance-in, rebalance-out,
# swap). Two spares, not one, because a swap rebalance needs a node to bring
# in at the same time as one goes out -- one spare only covers rebalance-in.
# (A separate 7th physical box is used as the NFS server -- it's not part of
# this `servers:` count at all, per CLAUDE.md: "The NFS server does not need
# to be one of the Couchbase nodes".)
#
# analytics and eventing are skipped for now (test_fusion_comprehensive.yml
# only exercises Fusion/KV/GSI/N1QL) -- index/query still share a single
# node instead of one node each, to keep 3 plain KV/data nodes free. This is
# done by pointing both services' custom *_start overrides at the same
# 1-based position (3), the same combining trick already used elsewhere in
# this repo (see local/scope_local.yml).
#
# With services: {index:1, query:1} and both *_start: 3 against
# init_nodes: 4, positions work out to (see InitNodeServices' startPos
# math):
#   nodes 0,1,3: plain KV/data (Fusion-backed buckets live here)
#   node 2:      index + query (combined)
#   nodes 4,5:   spares (outside init_nodes -- untouched)
#
# test_fusion_comprehensive.yml addresses nodes by raw scope position
# ({{.Nodes | net N}}) rather than by live active/inactive status once it
# starts chaining multiple sequential rebalances -- .ActiveDataNode/
# .InActiveNode re-resolve against current cluster state each time they're
# evaluated, so they stop meaning "the same physical node" once membership
# has already changed once. {{.Nodes | net N}} is Scope.Spec.Servers[0]
# .Names[N] -- purely static, unaffected by any of that. The rebalance
# topology changes there only ever touch net0, net1, net3 (data) plus
# net4/net5 (spares) -- net2 (the combined service node) is never a
# rebalance participant, so GSI/N1QL stays live and reachable through all
# three rebalances.
#
# index_ram is set explicitly (rather than left to auto-detect) because
# lib/scope.go's InitCluster() only auto-fills a service's ram quota (and
# only then adds its --cluster-index-ramsize flag at all) when the
# ORCHESTRATOR itself (net0) runs that service -- net0 here is plain KV, so
# index would otherwise never get a quota flag from cluster-init and would
# fall back to whatever Couchbase Server itself defaults to, uncontrolled.
# 2048MB is comfortably within node 2's 12GB (query has no fixed quota of
# its own -- it just uses whatever's left).

servers: # each server tag represents a cluster
  -
      name: local
      count: 6
      ram: 60%
      index_ram: "2048"
      services:
        index: 1
        index_start: 3
        query: 1
        query_start: 3
      rest_username: Administrator
      rest_password: password
      ssh_username: root
      ssh_password: couchbase
      data_path: "/data/dta"
      init_nodes: 4
