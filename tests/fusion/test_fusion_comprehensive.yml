- include: tests/templates/fusion.yml, tests/templates/nfs.yml, tests/templates/kv.yml, tests/templates/rebalance.yml, tests/templates/n1ql.yml

# v1 -- deliberately basic and short-running, per the plan in
# tests/fusion/CHAOS_PLAN.md's "Later stage" section. Fusion/KV/GSI/N1QL
# actions here follow patterns already proven working in this test suite
# (test_fusion_simple.yml, test_fusion_node_outage.yml). Eventing and
# analytics are skipped for now (scope_fusion_comprehensive.yml only
# provisions index/query alongside KV) -- see that file's git history if
# they need to come back.

############### set up NFS server + client mounts ################
- section_start: setup_nfs

- template: setup_nfs_server
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: setup_nfs_client_all_nodes
  requires: "{{eq true $.DoOnce }}"
  wait: true

- section_end: setup_nfs

############### configure and enable fusion ################
- section_start: setup_fusion

- template: configure_fusion
  args: "local:///mnt/nfs/share/buckets"
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: enable_fusion
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: wait_for_fusion_status
  args: "enabled"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: setup_fusion

############### create buckets ################
# bucket1/bucket2: Fusion-backed magma, where the actual Fusion behavior is
# exercised.
- section_start: create_buckets

- image: sequoiatools/couchbase-cli:8.5
  command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket bucket1 --bucket-ramsize 1024 --bucket-type couchbase
            --bucket-replica 1 --bucket-eviction-policy fullEviction
            --storage-backend magma --num-vbuckets 128 --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket bucket2 --bucket-ramsize 1024 --bucket-type couchbase
            --bucket-replica 1 --bucket-eviction-policy fullEviction
            --storage-backend magma --num-vbuckets 128 --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: create_buckets

############### stage the fusion rebalance driver scripts ################
- section_start: stage_fusion_scripts

- template: stage_fusion_rebalance_scripts_all_nodes
  requires: "{{eq true $.DoOnce }}"
  wait: true

- section_end: stage_fusion_scripts

############### load data ################
- section_start: data_load

# bucket1/bucket2: default collection
- image: sequoiatools/pillowfight:7.0
  command: "-u {{.RestUsername}} -P {{.RestPassword}} -U couchbase://{{.Orchestrator}}/bucket1
            -I {{.Scale 1000000}} -M 1024 -B 100 -t 4 --random-body --json --populate-only"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-u {{.RestUsername}} -P {{.RestPassword}} -U couchbase://{{.Orchestrator}}/bucket2
            -I {{.Scale 1000000}} -M 1024 -B 100 -t 4 --random-body --json --populate-only"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: data_load

############### basic GSI + N1QL ################
- section_start: gsi_n1ql

- template: cbq
  args: "'create index idx_bucket1_default on `bucket1` using GSI'"
  requires: "{{eq true .DoOnce }}"
  wait: true

# no separate build-wait needed -- no defer_build above, so this index
# already built synchronously as part of the create statement

- template: cbq
  args: "'select count(*) from `bucket1`'"
  wait: true

- section_end: gsi_n1ql

############### force fusion log store sync ################
- section_start: sync_log_store

- template: sync_log_store
  wait: true

- image: sequoiatools/cmd
  entrypoint: sleep
  command: "120"
  wait: true

- section_end: sync_log_store

############### fusion rebalance: in, out, swap ################
# All three use {{.Nodes | net N}} -- raw position in this scope's declared
# node list (Scope.Spec.Servers[0].Names[N]), not .ActiveDataNode/
# .InActiveNode -- those re-resolve against live cluster state each time
# they're evaluated, so once the first of these three rebalances has run,
# they no longer point at the same physical node they did before it. net0
# ({{.Orchestrator}}) is never touched by any of the three -- it's the
# fusion_rebalance driver and every REST check in this test targets it, so
# it needs to stay a genuine cluster member throughout, not just an
# externally-reachable box that fusion_rebalance has since rebalanced out.
#
# The "current"/"new" node sets below are the 3 plain KV/data nodes
# (net0, net1, net3) plus the 2 spares (net4, net5) -- net2, the combined
# index+query node (scope_fusion_comprehensive.yml), is deliberately never
# a rebalance participant here, so GSI/N1QL stays live and reachable on the
# cluster through all three rebalances -- that concurrency is as much the
# point as the rebalances themselves.
- section_start: fusion_rebalance_topology_changes

# 1. rebalance-in: node 4 (spare) joins. {net0,net1,net3} -> +net4
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 3}}), ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 3}},{{.Nodes | net 4}}), 60, 1"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

# 2. rebalance-out: node 4 leaves again, back to the original 3.
# {net0,net1,net3,net4} -> -net4
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 3}},{{.Nodes | net 4}}), ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 3}}), 60, 2"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

# 3. swap: node 5 (the second spare) in, node 1 out, in the same rebalance.
# {net0,net1,net3} -> {net0,net3,net5}
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 3}}), ({{.Nodes | net 0}},{{.Nodes | net 3}},{{.Nodes | net 5}}), 60, 3"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

- section_end: fusion_rebalance_topology_changes

############### verify ################
- section_start: verify_fusion

- template: get_fusion_status
  wait: true

- template: cbq
  args: "'select count(*) from `bucket1`'"
  wait: true

- section_end: verify_fusion
