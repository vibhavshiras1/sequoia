- include: tests/templates/fusion.yml, tests/templates/nfs.yml, tests/templates/kv.yml, tests/templates/rebalance.yml, tests/templates/n1ql.yml

# v1 -- deliberately basic and short-running, per the plan in
# tests/fusion/CHAOS_PLAN.md's "Later stage" section. Fusion/KV/GSI/N1QL
# actions here follow patterns already proven working in this test suite
# (test_fusion_simple.yml, test_fusion_node_outage.yml). The eventing and
# analytics actions are a first attempt, adapted down from
# tests/eventing/CC/test_eventing_rebalance_integration.yml and
# tests/analytics/cheshirecat/test_analytics_integration_scale3.yml (the
# same sections test_8.5.yml itself borrows via test:/section:) -- those
# two sections assume a much larger, test_8.5-shaped bucket layout, so
# this doesn't reuse them directly, just their flag shapes on our own,
# smaller buckets. Lower confidence than the Fusion/KV parts; expect this
# needs a debugging pass against a real run, same as every other test in
# this suite has so far.

############### set up NFS server + client mounts ################
- section_start: setup_nfs

- template: setup_nfs_server
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: setup_nfs_client_all_nodes
  requires: "{{eq true $.DoOnce }}"
  wait: true

- section_end: setup_nfs

############### configure and enable fusion ################
- section_start: setup_fusion

- template: configure_fusion
  args: "local:///mnt/nfs/share/buckets"
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: enable_fusion
  requires: "{{eq true .DoOnce }}"
  wait: true

- template: wait_for_fusion_status
  args: "enabled"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: setup_fusion

############### create buckets ################
# bucket1/bucket2: Fusion-backed magma, where the actual Fusion behavior is
# exercised. metabucket: plain couchstore, small -- exists purely as
# eventing's metadata bucket (must differ from the source bucket) and as
# analytics' data source (analyticsmanager's --data_src catapult expects
# catapult-shaped docs, hence the separate catapult load below rather than
# reusing the pillowfight-loaded fusion buckets for analytics).
- section_start: create_buckets

- image: sequoiatools/couchbase-cli:8.5
  command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket bucket1 --bucket-ramsize 1024 --bucket-type couchbase
            --bucket-replica 1 --bucket-eviction-policy fullEviction
            --storage-backend magma --num-vbuckets 128 --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket bucket2 --bucket-ramsize 1024 --bucket-type couchbase
            --bucket-replica 1 --bucket-eviction-policy fullEviction
            --storage-backend magma --num-vbuckets 128 --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "bucket-create -c {{.Orchestrator}}:{{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}}
            --bucket metabucket --bucket-ramsize 512 --bucket-type couchbase
            --bucket-replica 1 --bucket-eviction-policy fullEviction
            --storage-backend couchstore --num-vbuckets 128 --enable-flush 1 --wait"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: create_buckets

############### stage the fusion rebalance driver scripts ################
- section_start: stage_fusion_scripts

- template: stage_fusion_rebalance_scripts_all_nodes
  requires: "{{eq true $.DoOnce }}"
  wait: true

- section_end: stage_fusion_scripts

############### load data ################
- section_start: data_load

# bucket1/bucket2: default collection, small and short-running on purpose
- image: sequoiatools/pillowfight:7.0
  command: "-u {{.RestUsername}} -P {{.RestPassword}} -U couchbase://{{.Orchestrator}}/bucket1
            -I {{.Scale 10000}} -M 1024 -B 100 -t 4 --random-body --json --populate-only"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-u {{.RestUsername}} -P {{.RestPassword}} -U couchbase://{{.Orchestrator}}/bucket2
            -I {{.Scale 10000}} -M 1024 -B 100 -t 4 --random-body --json --populate-only"
  requires: "{{eq true .DoOnce }}"
  wait: true

# metabucket: catapult, matching the doc shape analyticsmanager's
# --data_src catapult (below) expects
- image: sequoiatools/catapult
  command: "-i {{.Orchestrator}} -u {{.RestUsername}} -p {{.RestPassword}} -b metabucket -n {{.Scale 2000}} -pc 100 -dt Hotel -ds 1000 -ac True"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: data_load

############### basic GSI + N1QL ################
- section_start: gsi_n1ql

- template: cbq
  args: "'create index idx_bucket1_default on `bucket1` using GSI'"
  requires: "{{eq true .DoOnce }}"
  wait: true

# no separate build-wait needed -- no defer_build above, so this index
# already built synchronously as part of the create statement

- template: cbq
  args: "'select count(*) from `bucket1`'"
  wait: true

- section_end: gsi_n1ql

############### basic eventing ################
# one simple sbm (source-bucket-mutation) handler -- the simplest handler
# type in tests/eventing/CC/test_eventing_rebalance_integration.yml, chosen
# specifically to avoid also needing n1ql/curl bindings for a first pass.
- section_start: eventing

- image: sequoiatools/eventing:7.0
  command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}}
            -s bucket1._default._default -m metabucket._default._default
            -d dst_bucket.bucket2._default._default.rw -t sbm -o create --name basic_sbm"
  requires: "{{eq true .DoOnce }}"
  wait: true

- command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o deploy"
  requires: "{{eq true .DoOnce }}"
  wait: true

- command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o wait_for_state --state deployed"
  requires: "{{eq true .DoOnce }}"
  wait: true

- section_end: eventing

############### basic analytics ################
# 1 dataverse, 1 dataset, 1 index, 1 synonym -- smallest shape
# create_cbas_infra supports, against metabucket's catapult-loaded data
- section_start: analytics

- image: sequoiatools/analyticsmanager:1.0
  command: "-i {{.ActiveAnalyticsNode 0 | noport}} -b metabucket -o create_cbas_infra
            --dv_cnt 1 --ds_cnt 1 --idx_cnt 1 --data_src catapult --syn_cnt 1
            -w false --ingestion_timeout 600 --ds_without_where 1 --api_timeout 600"
  requires: "{{eq true .DoOnce }}"
  wait: true

# let ingestion get underway before querying
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "60"
  wait: true

- image: sequoiatools/queryapp
  command: "-J-Xms256m -J-Xmx512m -J-cp /AnalyticsQueryApp/Couchbase-Java-Client-2.7.21/* /AnalyticsQueryApp/Query/load_queries.py
            --server_ip {{.ActiveAnalyticsNode 0}} --port {{.AnalyticsPort}} --duration 0 --bucket metabucket
            --querycount 5 -a True --analytics_queries catapult_queries --query_timeout 600 -B [metabucket]"
  wait: true

- section_end: analytics

############### force fusion log store sync ################
- section_start: sync_log_store

- template: sync_log_store
  wait: true

- image: sequoiatools/cmd
  entrypoint: sleep
  command: "120"
  wait: true

- section_end: sync_log_store

############### fusion rebalance: in, out, swap ################
# All three use {{.Nodes | net N}} -- raw position in this scope's declared
# node list (Scope.Spec.Servers[0].Names[N]), not .ActiveDataNode/
# .InActiveNode -- those re-resolve against live cluster state each time
# they're evaluated, so once the first of these three rebalances has run,
# they no longer point at the same physical node they did before it. net0
# ({{.Orchestrator}}) is never touched by any of the three -- it's the
# fusion_rebalance driver and every REST check in this test targets it, so
# it needs to stay a genuine cluster member throughout, not just an
# externally-reachable box that fusion_rebalance has since rebalanced out.
#
# GSI/N1QL, eventing, and analytics are all live on the cluster through all
# three rebalances -- that concurrency is as much the point as the
# rebalances themselves.
- section_start: fusion_rebalance_topology_changes

# 1. rebalance-in: node 8 (spare) joins. {net0,net1,net2,net3} -> +net8
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 2}},{{.Nodes | net 3}}), ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 2}},{{.Nodes | net 3}},{{.Nodes | net 8}}), 60, 1"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

# 2. rebalance-out: node 8 leaves again, back to the original 4.
# {net0,net1,net2,net3,net8} -> -net8
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 2}},{{.Nodes | net 3}},{{.Nodes | net 8}}), ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 2}},{{.Nodes | net 3}}), 60, 2"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

# 3. swap: node 9 (the second spare) in, node 1 out, in the same rebalance.
# {net0,net1,net2,net3} -> {net0,net2,net3,net9}
- template: fusion_rebalance
  args: "{{.Orchestrator}}, ({{.Nodes | net 0}},{{.Nodes | net 1}},{{.Nodes | net 2}},{{.Nodes | net 3}}), ({{.Nodes | net 0}},{{.Nodes | net 2}},{{.Nodes | net 3}},{{.Nodes | net 9}}), 60, 3"
  wait: true
- template: wait_for_rebalance
  wait: true
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "30"
  wait: true
- template: wait_for_guest_volumes_drained
  wait: true

- section_end: fusion_rebalance_topology_changes

############### verify ################
- section_start: verify_fusion

- template: get_fusion_status
  wait: true

- template: cbq
  args: "'select count(*) from `bucket1`'"
  wait: true

- image: sequoiatools/eventing:7.0
  command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o wait_for_state --state deployed"
  wait: true

- section_end: verify_fusion

############### teardown of non-fusion services ################
- section_start: teardown

- image: sequoiatools/eventing:7.0
  command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o undeploy"
  wait: true
- command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o wait_for_state --state undeployed"
  wait: true
- command: "eventing_helper.py -i {{.EventingNode}} -u {{.RestUsername}} -p {{.RestPassword}} -o delete"
  wait: true

- image: sequoiatools/analyticsmanager:1.0
  command: "-i {{.ActiveAnalyticsNode 0 | noport}} -b metabucket -o drop_cbas_infra --api_timeout 600"
  wait: true

- section_end: teardown
